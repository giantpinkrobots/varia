
name: varia
base: core26
version: 'v2026.8.5-1'
summary: Download files, videos and torrents
description: |
  Varia is a file, video and torrent downloader based on aria2 and yt-dlp

grade: stable
confinement: strict

slots:
  dbus-varia:
    interface: dbus
    bus: session
    name: io.github.giantpinkrobots.varia

parts:
  python-runtime:
    plugin: nil
    stage-packages:
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - python3-minimal
      - python3.14-minimal
      - python3.14-venv

  python-packages:
    plugin: python
    source: .
    after:
      - python-runtime
    python-packages:
      - yt-dlp[default]
      - aria2p
      - emoji-country-flag
      - dbus-next
      - libtorrent
    build-packages:
      - python3-pip
      - python3-setuptools
      - python3-wheel
      - build-essential

  aria2-next:
    plugin: nil
    source:
      - on amd64: https://github.com/AnInsomniacy/aria2-next/releases/download/v3.0.7/aria2-next-3.0.7-linux-x86_64
      - on arm64: https://github.com/AnInsomniacy/aria2-next/releases/download/v3.0.7/aria2-next-3.0.7-linux-aarch64
    source-type: file
    override-build: |
      install -Dm755 aria2-next-* "$CRAFT_PART_INSTALL/bin/aria2-next"

  ffmpeg:
    plugin: autotools
    source: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n9.0.tar.gz
    source-checksum: sha256/d97647ace36a307f17ba2bca052d68937487bed8682e1eb9b6737076a9c442b7
    autotools-configure-parameters:
      - --disable-debug
      - --disable-devices
      - --disable-doc
      - --disable-ffplay
      - --disable-static
      - --enable-gnutls
      - --enable-libmp3lame
      - --enable-libopus
      - --enable-libvorbis
      - --enable-shared
    override-build: |
      ./configure \
        --disable-debug \
        --disable-devices \
        --disable-doc \
        --disable-ffplay \
        --disable-static \
        --enable-gnutls \
        --enable-libmp3lame \
        --enable-libopus \
        --enable-libvorbis \
        --enable-shared \
        --prefix="$CRAFT_PART_INSTALL"
      make -j"${CRAFT_PARALLEL_BUILD_COUNT:-2}"
      make install
    build-packages:
      - build-essential
      - libgnutls28-dev
      - libmp3lame-dev
      - libopus-dev
      - libvorbis-dev
      - yasm
      - nasm

  quickjs:
    plugin: nil
    source: https://github.com/bellard/quickjs
    source-type: git
    source-commit: 84e723f1ace5e3823cef8149dd0f890fe74b77ce
    override-build: |
      make -j"${CRAFT_PARALLEL_BUILD_COUNT:-2}" \
        qjs cxxflags="$CXXFLAGS" linkflags="$LDFLAGS"
      strip qjs
      install -Dm755 qjs "$CRAFT_PART_INSTALL/bin/qjs"
    build-packages:
      - build-essential

  sevenzip:
    plugin: nil
    source:
      - on amd64: https://github.com/ip7z/7zip/releases/download/26.04/7z2604-linux-x64.tar.xz
      - on arm64: https://github.com/ip7z/7zip/releases/download/26.04/7z2604-linux-arm64.tar.xz
    source-type: file
    override-build: |
      tar -xf ./7z*
      install -Dm755 7zzs "$CRAFT_PART_INSTALL/bin/7zz"

  varia:
    plugin: meson
    source: .
    after:
      - python-packages
      - aria2-next
      - ffmpeg
      - quickjs
      - sevenzip
    parse-info:
      - usr/local/share/metainfo/io.github.giantpinkrobots.varia.metainfo.xml
    build-packages:
      - meson
      - ninja-build
      - gettext
      - libglib2.0-dev
      - libgtk-4-dev
      - desktop-file-utils
    stage-packages:
      - libssl3t64
    organize:
      usr/local: usr
    override-prime: |
      craftctl default
      sed -i 's|Icon=.*|Icon=io.github.giantpinkrobots.varia.svg|' \
        usr/share/applications/io.github.giantpinkrobots.varia.desktop

apps:
  varia:
    extensions:
      - gnome
    command: usr/bin/varia
    slots:
      - dbus-varia
    plugs:
      - network
      - home
      - wayland
      - x11
      - desktop
      - shutdown
      - desktop-legacy
    desktop: usr/share/applications/io.github.giantpinkrobots.varia.desktop
    common-id: io.github.giantpinkrobots.varia.desktop
    autostart: io.github.giantpinkrobots.varia.desktop
