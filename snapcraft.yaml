name: varia
base: core24
version: 'v2026.8.5'
summary: Download files, videos and torrents
description: |
  Varia is a file, video and torrent downloader based on aria2 and yt-dlp

grade: stable
confinement: strict

slots:
  dbus-varia:
    interface: dbus
    bus: session
    name: io.github.giantpinkrobots.varia

parts:
  python-packages:
    plugin: python
    source: .
    python-packages:
      - yt-dlp[default]
      - aria2p
      - emoji-country-flag
      - dbus-next
      - libtorrent
    build-packages:
      - python3-pip
      - python3-setuptools
    stage-packages:
      - python3

  aria2:
    plugin: autotools
    source: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
    source-checksum: sha256/60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b
    override-build: |
      ./configure \
        --without-libxml2 \
        --without-sqlite3 \
        --without-appletls \
        --without-gnutls \
        --without-libgmp \
        --without-libnettle \
        --without-libgcrypt \
        --without-libssh2 \
        --without-cppunit \
        --without-libz \
        --without-libcunit \
        --without-libcares \
        --without-libaria2 \
        --disable-nls \
        --with-openssl \
        --disable-ftp \
        --prefix=$SNAPCRAFT_PART_INSTALL
      make
      make install
    build-packages:
      - build-essential
      - autoconf
      - automake
      - libssl-dev
      - pkg-config

  ffmpeg:
    plugin: autotools
    source: https://ffmpeg.org/releases/ffmpeg-9.0.tar.xz
    source-checksum: sha256/7f607a00dd0d28a729d5a4811205812eef01cf6ef6155025febb6f36a9062d52
    override-build: |
      ./configure \
        --disable-debug \
        --disable-devices \
        --disable-doc \
        --disable-ffplay \
        --disable-static \
        --enable-gnutls \
        --enable-libmp3lame \
        --enable-libopus \
        --enable-libvorbis \
        --enable-shared \
        --prefix=$SNAPCRAFT_PART_INSTALL
      make
      make install
    build-packages:
      - build-essential
      - libgnutls28-dev
      - libmp3lame-dev
      - libopus-dev
      - libvorbis-dev
      - yasm
      - nasm
  
  deno:
    plugin: nil
    source: https://github.com/denoland/deno/archive/refs/tags/v2.9.4.tar.gz
    source-type: tar
    override-build: |
      export CARGO_HOME="$SNAPCRAFT_PART_BUILD/.cargo"
      export RUSTUP_HOME="$SNAPCRAFT_PART_BUILD/.rustup"
      export PATH="$CARGO_HOME/bin:$PATH"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
      cargo build --locked --release
      install -Dm755 ./target/release/deno "$SNAPCRAFT_PART_INSTALL/bin/deno"
    build-packages:
      - curl
      - cmake
      - clang
      - libclang-dev

  sevenzip:
    plugin: nil
    source: https://github.com/ip7z/7zip.git
    source-type: git
    source-commit: f9d78aff31a5f2521ae7ddbdc97c4a8855808959
    override-build: |
      for bundle in Alone2 SFXCon; do
        pushd CPP/7zip/Bundles/${bundle}
        make -j"$(nproc)" -f ../../cmpl_gcc.mak
        popd
      done
      install -Dm755 CPP/7zip/Bundles/Alone2/b/g/7zz "$SNAPCRAFT_PART_INSTALL/bin/7zz"
    build-packages:
      - build-essential
      - g++
      - make
    stage-packages:
      - libc6
      - libstdc++6

  boost:
    plugin: nil
    source: https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz
    source-type: tar
    override-build: |
      ./bootstrap.sh --prefix=/app
      ./b2 install --with-headers cxxflags='$CXXFLAGS' linkflags='$LDFLAGS'

  libtorrent:
    plugin: cmake
    source: https://github.com/arvidn/libtorrent.git
    source-type: git
    source-commit: 578e06824c3546f3371ab43967ab288a7e253eca
    build-packages:
      - build-essential
      - libboost-dev
      - libssl-dev
    cmake-parameters:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_STANDARD=20
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
    prime:
      - -*

  varia:
    plugin: meson
    source: .
    parse-info: [usr/local/share/metainfo/io.github.giantpinkrobots.varia.metainfo.xml]
    build-packages:
      - meson
      - ninja-build
      - gettext
      - libglib2.0-dev
      - libgtk-4-dev
      - desktop-file-utils
    stage-packages:
      - libssl-dev
      - libc6
      - libstdc++6
    organize:
      usr/local: usr
    override-prime: |
      craftctl default
      sed -i 's|Icon=.*|Icon=/usr/share/icons/hicolor/scalable/io.github.giantpinkrobots.varia.svg|' usr/share/applications/io.github.giantpinkrobots.varia.desktop

apps:
  varia:
    extensions: [gnome]
    command: usr/bin/varia
    slots:
      - dbus-varia
    plugs:
      - network
      - home
      - wayland
      - x11
      - desktop
      - shutdown
      - desktop-legacy
    desktop: usr/share/applications/io.github.giantpinkrobots.varia.desktop
    common-id: io.github.giantpinkrobots.varia.desktop
    autostart: io.github.giantpinkrobots.varia.desktop
